# Local development and demo stack. For a production-like setup, add docker-compose.prod.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Host ports come from .env (see .env.example) so they can be changed without editing this file.
# Containers always talk to each other on their internal ports (postgres:5432, backend:8080), so changing a
# host port never requires changing application configuration.
name: enterpriseflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enterpriseflow}
      POSTGRES_USER: ${POSTGRES_USER:-enterpriseflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (run ./scripts/setup-env.sh)}
    ports:
      # Bound to localhost only: reachable from your machine (psql, IDE), never from the network.
      # 5433 instead of 5432 so it never collides with a PostgreSQL installed directly on the machine.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev,demo}
      # Internal network address: the container port, not the host port above.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-enterpriseflow}
      DB_USERNAME: ${POSTGRES_USER:-enterpriseflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (run ./scripts/setup-env.sh)}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo12345!}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      # Exposed for Swagger UI and API tools during development.
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      # Wait for an accepting database, not just a started container; otherwise Flyway fails on boot.
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # nginx serves the SPA and proxies /api to backend:8080, so the browser only ever sees this one origin.
      - "127.0.0.1:${FRONTEND_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
