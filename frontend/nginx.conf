server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Same-origin proxy to the backend: the browser never talks to it directly, so CORS is unnecessary.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Only health is exposed through the public entry point, not the rest of actuator.
    location = /actuator/health {
        proxy_pass http://backend:8080;
    }

    # Hashed assets are immutable, so they can be cached forever.
    # Security headers are repeated: any add_header in a location discards the server-level ones.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: unknown paths serve index.html and React Router handles them client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
